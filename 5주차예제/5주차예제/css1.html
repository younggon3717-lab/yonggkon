<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css1</title>
    <style>
        h1{
            color:red;
        }
        h2{
            color:aqua;
        }
        #name{
            background-color: blue;
        }
        .cl{
            background-color: bisque;
        }
    </style>
</head>
<body>
    <h1 id="name">CSS 기본 입니다.</h1>
    <h1 class="cl">태그 선택자</h1>
    <h2>태그 선택자 h2 입니다</h2>
    <p><h1>p태그 입니다</h1></p>
</body>
</html>
