<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form Basic</title>
</head>
<body>
    <form onsubmit="showInfo(event)">
        <table border="1">
            <tr>
                <td><label for="username">이름</label></td>
                <td><input id="username" type="text" name="username"></td>
            </tr>
            <tr>
                <td><label for="tel">전화번호</label></td>
                <td><input id="tel" type="text" name="tel"></td>
            </tr>
            <tr>
                <td>성별</td>
                <td>
                    <input id="man" type="radio" name="gender" value="남자">
                    <label for="man">남자</label>
                    <input id="woman" type="radio" name="gender" value="여자">
                    <label for="woman">여자</label>
                </td>
            </tr>
        </table>
        <input type="submit" value="가입">
    </form>

    <h3>가입 정보</h3>
    <p id="result"></p>

    <script>
        function showInfo(event) {
            event.preventDefault();

            let name = document.getElementById("username").value;
            let tel = document.getElementById("tel").value;
            let gender = document.querySelector('input[name="gender"]:checked');

            let genderValue = gender ? gender.value : "선택 안 함";

            document.getElementById("result").innerHTML =
                "이름: " + name + "<br>" +
                "전화번호: " + tel + "<br>" +
                "성별: " + genderValue;
        }
    </script>
    <form>
        <table border="1">
            <tr>
                <td><label for="username">이름</label></td>
                <td><input id="username" type="text" name="username"></td>
            </tr>
            <tr>
                <td><label for="tel">전화번호</label></td>
                <td><input id="tel" type="text" name="username"></td>
            </tr>
            </tr>
            <tr>
                <td>성별</td>
                <td>
                    <input id="man" type="radio" name="gender" value="m">
                    <label for="man">남자</label>
                    <input id="woman" type="radio" name="gender" value="w">
                    <label for="woman">여자</label>
                </td>
            </tr>
        </table>
        <input type="submit" value="가입">
    </form>
</body>
</html>
